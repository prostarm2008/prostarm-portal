<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostarm - My Profile</title>
    <link rel="icon" type="png" href="Prostarm logo.png">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true' && localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "login.html";
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; padding: 30px 20px; color: #334155; }
        .back-btn { display: inline-flex; padding: 10px 15px; background: #fff; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; font-weight: 600; text-decoration: none; color: #475569; }
        .card { background: #fff; padding: 35px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); max-width: 500px; margin: 0 auto; border-top: 4px solid #f59e0b; }
        h2 { color: #1e293b; margin-bottom: 20px; text-align: center; }
        .user-badge { display: block; text-align: center; background: #e0e7ff; color: #4f46e5; padding: 10px; border-radius: 8px; font-weight: bold; margin-bottom: 25px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; color: #64748b; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        .save-btn { width: 100%; padding: 14px; background: #f59e0b; color: white; border: none; border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .save-btn:hover { background: #d97706; }
    </style>
</head>
<body>
    <a href="home.html" class="back-btn">⬅ Back to Home</a>
    <div class="card">
        <h2>👤 My Profile</h2>
        <div class="user-badge" id="profileBadge">Loading...</div>

        <form id="passwordForm">
            <label>New Password</label>
            <input type="password" id="newPassword" required placeholder="Enter new secure password">
            
            <button type="submit" class="save-btn" id="saveBtn">Update Password</button>
        </form>
    </div>

    <script>
        const userName = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser');
        const userRole = sessionStorage.getItem('currentRole') || localStorage.getItem('currentRole');
        
        document.getElementById('profileBadge').innerText = `${userName} | Role: ${userRole}`;

        document.getElementById('passwordForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const newPass = document.getElementById('newPassword').value;
            const btn = document.getElementById('saveBtn');
            
            btn.innerText = "Updating...";
            btn.disabled = true;

            // REPLACE WITH YOUR NEW UPDATE PASSWORD POST URL
            const updateUrl = "https://default000090a2d8654861ba6937e8e47451.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/6c0393de166749eb885e64b5e5324b05/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=WiNQBOsKpWNiQ3Ev6fO7NV1FVa5dJOrngMciajYVBak";

            fetch(updateUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ FullName: userName, NewPassword: newPass })
            })
            .then(res => {
                if(res.ok) {
                    alert("Password updated successfully!");
                    document.getElementById('newPassword').value = '';
                } else {
                    alert("Failed to update password.");
                }
            })
            .catch(() => alert("Network Error"))
            .finally(() => {
                btn.innerText = "Update Password";
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
