<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Dashboard</title>
<link rel="icon" type="png" href="Prostarm logo.png">
<script>
    if (sessionStorage.getItem('isLoggedIn') !== 'true' && localStorage.getItem('isLoggedIn') !== 'true') {
        window.location.href = "login.html";
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2"></script>

<style>
body { 
    font-family: Arial, sans-serif; 
    background: #f5f7fb; 
    margin: 20px; 
    color: #333;
}
h2 { text-align: center; color: #1e293b; }

.cards {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 15px;
}
.card {
    background: #fff;
    padding: 20px 15px;
    border-radius: 10px;
    text-align: center;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.card b {
    display: block;
    font-size: 24px;
    margin-top: 8px;
    color: #4f46e5;
}

.charts {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
    gap: 20px;
    margin-top: 20px;
}
.chart-box {
    background: #fff;
    padding: 15px;
    border-radius: 10px;
    height: 300px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
canvas {
    width: 100% !important;
    height: 100% !important;
}

#details {
    margin-top: 20px;
    background: #fff;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    overflow-x: auto;
}
table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    text-align: left;
}
th, td {
    border: 1px solid #e2e8f0;
    padding: 10px;
}
th { background: #f8fafc; color: #475569; }

#filterStatus {
    text-align: center; 
    margin-top: 15px; 
    font-size: 15px; 
    color: #1e293b; 
    background: #e0e7ff; 
    padding: 12px; 
    border-radius: 8px;
    font-weight: bold;
    box-shadow: 0 2px 6px rgba(0,0,0,0.05);
}
.clear-btn {
    margin-left: 10px; 
    padding: 6px 14px; 
    background: #ef4444; 
    color: #fff; 
    border: none; 
    border-radius: 5px; 
    cursor: pointer;
    font-weight: bold;
    transition: 0.2s;
}
.clear-btn:hover { background: #dc2626; }
</style>
</head>

<body>
<a href="home.html" style="display: inline-block; padding: 10px 15px; background: #f4f6f9; color: #2c3e50; text-decoration: none; border-radius: 5px; margin-bottom: 20px; border: 1px solid #d1d5db; font-weight: bold;">⬅ Back to Home</a>
<h2>📊 Service Dashboard</h2>

<div class="cards">
    <div class="card">Total Completed<br><b id="total">0</b></div>
    <div class="card">UPS<br><b id="ups">0</b></div>
    <div class="card">IT<br><b id="it">0</b></div>
    <div class="card">Servo<br><b id="servo">0</b></div>
    <div class="card">Spare Part<br><b id="spare">0</b></div>
</div>

<div id="filterStatus">Click any chart segment to filter data.</div>

<div class="charts">
    <div class="chart-box"><canvas id="statusChart"></canvas></div>
    
    <div class="chart-box"><canvas id="itemChart"></canvas></div>
    <div class="chart-box"><canvas id="moduleChart"></canvas></div>
    <div class="chart-box"><canvas id="phaseChart"></canvas></div>
    <div class="chart-box"><canvas id="dateChart"></canvas></div>
    <div class="chart-box"><canvas id="capacityChart"></canvas></div>
    <div class="chart-box"><canvas id="engineerChart"></canvas></div>
    <div class="chart-box"><canvas id="entryHourChart"></canvas></div>
</div>

<div id="details">
    <h3>Details</h3>
    <table id="table">
        <tr><td>Loading data...</td></tr>
    </table>
</div>

<script>
    const currentUser = sessionStorage.getItem('currentUser') || localStorage.getItem('currentUser');
    const currentRole = sessionStorage.getItem('currentRole') || localStorage.getItem('currentRole');
    let rawData = [];
    let processedData = [];

    // ✅ LIVE SYNC: Fetch real-time data from Excel via Power Automate
    async function fetchLiveDashboardData() {
        const getFlowUrl = "https://default000090a2d8654861ba6937e8e47451.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/94e132b6131146539feb3a07dfe29265/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=qzTfkNnWY9w8Yec-N4OBqm5QZdKMPTQL1M7EHiCfAdw"; 
        const statusText = document.getElementById('filterStatus');
        
        statusText.innerHTML = "⏳ Fetching live data from cloud...";
        statusText.style.backgroundColor = "#fef3c7";

        try {
            const response = await fetch(getFlowUrl, { method: 'GET' });
            
            if (!response.ok) throw new Error("Network response was not ok");
            
            const liveData = await response.json();
            
            if (currentRole === 'Engineer') {
                rawData = liveData.filter(row => row["Engineer Name"] === currentUser);
            } else {
                rawData = liveData;
            }

            localStorage.setItem("excelData", JSON.stringify(liveData));

            statusText.innerHTML = "✅ Live Data Synced. Click any chart segment to filter data.";
            statusText.style.backgroundColor = "#dcfce7"; 

            processDataForCharts(); 

        } catch (error) {
            console.error("Error fetching live data:", error);
            statusText.innerHTML = "❌ Failed to load live data. Showing offline backup.";
            statusText.style.backgroundColor = "#fee2e2"; 
            
            rawData = JSON.parse(localStorage.getItem("excelData")) || [];
            if (currentRole === 'Engineer') {
                rawData = rawData.filter(row => row["Engineer Name"] === currentUser);
            }
            processDataForCharts();
        }
    }

    /* Utility Date Formatters */
    const pad = n => String(n).padStart(2, '0');
    const formatDateTime = d => `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
    const formatDateOnly = d => `${pad(d.getDate())}-${pad(d.getMonth()+1)}-${d.getFullYear()}`;
    const formatHourAMPM = hr => hr === 0 ? "12 AM" : hr < 12 ? `${hr} AM` : hr === 12 ? "12 PM" : `${hr - 12} PM`;

    function parseSafeDate(dStr) {
        if (!dStr) return null;
        let str = String(dStr).trim();
        if (/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}/.test(str)) {
            str = str.replace(" ", "T");
        }
        let d = new Date(str);
        if (!isNaN(d.getTime())) return d;
        
        let parts = str.match(/(\d{1,4})[\/\-](\d{1,2})[\/\-](\d{1,4})(?:\s+(\d{1,2}):(\d{1,2})(?::(\d{1,2}))?)?(?:\s*(AM|PM|am|pm))?/);
        if (parts) {
            let p1 = parseInt(parts[1]), p2 = parseInt(parts[2]), p3 = parseInt(parts[3]);
            let year, month, day;
            if (p3 >= 1000) { year = p3; if (p2 > 12) { day = p2; month = p1; } else { day = p1; month = p2; } }
            else if (p1 >= 1000) { year = p1; month = p2; day = p3; }
            
            let hr = parseInt(parts[4] || 0), min = parseInt(parts[5] || 0), sec = parseInt(parts[6] || 0);
            let ampm = (parts[7] || "").toUpperCase();
            if (ampm === "PM" && hr < 12) hr += 12;
            if (ampm === "AM" && hr === 12) hr = 0;
            
            let fallback = new Date(year, month - 1, day, hr, min, sec);
            if (!isNaN(fallback.getTime())) return fallback;
        }
        return null;
    }

    function processDataForCharts() {
        processedData = [];
        rawData.forEach(r => {
            let compDate = parseSafeDate(r["Repair Completion Date"]);
            if (!compDate) return; 
            r["Repair Completion Date"] = formatDateOnly(compDate);

            let entryDate = parseSafeDate(r["Entry Date"]);
            if (entryDate) {
                r["Entry Date"] = formatDateTime(entryDate);
                r["_entryHourLabel"] = formatHourAMPM(entryDate.getHours());
                r["_entryHourRaw"] = entryDate.getHours();
            }
            processedData.push(r);
        });
        
        renderDashboard();
    }

    let charts = {};

    function createOrUpdateChart(id, type, labels, values, label, field, color) {
        if (charts[id]) {
            charts[id].data.labels = labels;
            charts[id].data.datasets[0].data = values;
            charts[id].update();
        } else {
            charts[id] = new Chart(document.getElementById(id), {
                type: type,
                data: {
                    labels: labels,
                    datasets: [{
                        label: label,
                        data: values,
                        backgroundColor: color,
                        borderWidth: 1
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    layout: { padding: { top: 20 } },
                    plugins: {
                        title: { display: true, text: label, font: { size: 16 } },
                        legend: { display: type === 'doughnut' || type === 'pie' },
                        datalabels: {
                            color: '#000',
                            anchor: (context) => context.chart.config.type === 'line' ? 'end' : 'center',
                            align: (context) => context.chart.config.type === 'line' ? 'bottom' : 'center',
                            offset: (context) => context.chart.config.type === 'line' ? 6 : 2,
                            font: { weight: 'bold', size: 10 },
                            formatter: (value) => value
                        }
                    },
                    onClick: (e, el) => {
                        if (el.length > 0) {
                            const i = el[0].index;
                            renderDashboard(field, labels[i]); 
                        }
                    }
                },
                plugins: [ChartDataLabels]
            });
        }
    }

    function renderTable(dataArray) {
        const tableEl = document.getElementById("table");
        if (!dataArray.length) {
            tableEl.innerHTML = "<tr><td>No Data found for this selection.</td></tr>";
            return;
        }

        let html = "<tr>";
        const keys = Object.keys(dataArray[0]).filter(k => !k.startsWith("_"));
        keys.forEach(k => html += `<th>${k}</th>`);
        html += "</tr>";

        dataArray.forEach(r => {
            html += "<tr>";
            keys.forEach(k => html += `<td>${r[k] ?? ""}</td>`);
            html += "</tr>";
        });

        tableEl.innerHTML = html;
    }

    function renderDashboard(filterField = null, filterValue = null) {
        let filtered = processedData;
        const filterStatus = document.getElementById("filterStatus");

        if (filterField && filterValue) {
            filtered = processedData.filter(r => {
                if (filterField === "System Capacity (KVA)") {
                    return String(parseInt(r[filterField])) === String(filterValue);
                }
                return String(r[filterField] || "") === String(filterValue);
            });
            
            let displayField = filterField === "_entryHourLabel" ? "Peak Entry Hour" : filterField;
            
            filterStatus.innerHTML = `Viewing Data for: <span style="color:#4f46e5; text-decoration: underline;">${displayField} = ${filterValue}</span> 
                <button class="clear-btn" onclick="renderDashboard()">Clear Filter ✖</button>`;
        } else {
            filterStatus.innerHTML = `💡 Click any bar, line point, or pie slice to interactively filter the entire dashboard.`;
        }

        // Added 'statusCounts' to our data containers
        const item = {}, module = {}, dateCounts = {}, cap = {}, engineer = {}, hourCounts = {}, phase = {}, statusCounts = {};
        const hourRawMap = {}; 
        
        filtered.forEach(r => {
            const endStr = r["Repair Completion Date"];
            dateCounts[endStr] = (dateCounts[endStr] || 0) + 1;
            
            const iType = r["Item Type"] || "Other";
            item[iType] = (item[iType] || 0) + 1;
            
            const mod = r["Module"] || "Unknown";
            module[mod] = (module[mod] || 0) + 1;
            
            const eng = r["Engineer Name"] || "Unknown";
            engineer[eng] = (engineer[eng] || 0) + 1;
            
            const capVal = parseInt(r["System Capacity (KVA)"]);
            if (!isNaN(capVal)) cap[capVal] = (cap[capVal] || 0) + 1;

            if (r["_entryHourLabel"]) {
                let hrLabel = r["_entryHourLabel"];
                hourCounts[hrLabel] = (hourCounts[hrLabel] || 0) + 1;
                hourRawMap[hrLabel] = r["_entryHourRaw"]; 
            }

            const ph = r["Electrical Phase"] || "Unknown";
            phase[ph] = (phase[ph] || 0) + 1;

            // Extract the Repair Status data
            const stat = r["Repair Status"] || "Unknown";
            statusCounts[stat] = (statusCounts[stat] || 0) + 1;
        });

        document.getElementById("total").innerText = filtered.length;
        document.getElementById("ups").innerText = item["UPS"] || 0;
        document.getElementById("it").innerText = item["IT"] || 0;
        document.getElementById("servo").innerText = item["Servo"] || 0;
        document.getElementById("spare").innerText = item["Spare Part"] || 0;

        // Render the new Repair Status Chart (Green for Repaired, Red for Not Repairable)
        createOrUpdateChart("statusChart", "doughnut", Object.keys(statusCounts), Object.values(statusCounts), "Repair Status", "Repair Status", ['#10b981', '#ef4444', '#9ca3af']);

        createOrUpdateChart("itemChart", "doughnut", Object.keys(item), Object.values(item), "Item Type", "Item Type", ['#3b82f6', '#f59e0b', '#0ea5e9', '#8b5cf6']);
        createOrUpdateChart("moduleChart", "bar", Object.keys(module), Object.values(module), "Module", "Module", "#6366f1");
        
        createOrUpdateChart("phaseChart", "pie", Object.keys(phase), Object.values(phase), "Electrical Phase", "Electrical Phase", ['#8b5cf6', '#ec4899', '#06b6d4', '#94a3b8']);
        
        const sortedDates = Object.keys(dateCounts).sort((a, b) => {
            let p1 = a.split("-"), p2 = b.split("-");
            return new Date(p1[2], p1[1]-1, p1[0]).getTime() - new Date(p2[2], p2[1]-1, p2[0]).getTime();
        });
        createOrUpdateChart("dateChart", "line", sortedDates, sortedDates.map(d => dateCounts[d]), "Repair Trend", "Repair Completion Date", "#10b981");

        const sortedCap = Object.keys(cap).sort((a, b) => a - b);
        createOrUpdateChart("capacityChart", "bar", sortedCap, sortedCap.map(k => cap[k]), "Capacity (KVA)", "System Capacity (KVA)", "#ef4444");

        const sortedEng = Object.keys(engineer).sort((a, b) => engineer[b] - engineer[a]);
        createOrUpdateChart("engineerChart", "bar", sortedEng, sortedEng.map(k => engineer[k]), "Completed Jobs by Engineer", "Engineer Name", "#14b8a6");

        const sortedHours = Object.keys(hourCounts).sort((a, b) => hourRawMap[a] - hourRawMap[b]);
        createOrUpdateChart("entryHourChart", "bar", sortedHours, sortedHours.map(h => hourCounts[h]), "Peak Entry Hours", "_entryHourLabel", "#f59e0b");

        renderTable(filtered);
    }

    // Trigger the live fetch immediately when the page opens
    fetchLiveDashboardData();

</script>
</body>
</html>
