<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostarm - Directory</title>
    <link rel="icon" type="png" href="Prostarm logo.png">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true' && localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "login.html";
        }
    </script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #f4f6f9; padding: 30px 20px; color: #334155; }
        .back-btn { display: inline-flex; padding: 10px 15px; background: #fff; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; font-weight: 600; text-decoration: none; color: #475569; }
        .card { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); max-width: 1000px; margin: 0 auto; border-top: 4px solid #10b981; }
        h2 { color: #1e293b; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        .table-wrapper { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; white-space: nowrap;}
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
    </style>
</head>
<body>
    <a href="home.html" class="back-btn">⬅ Back to Home</a>
    <div class="card">
        <h2>🏢 Customer & Site Directory</h2>
        <input type="text" id="searchBox" placeholder="Search by Serial Number, Customer, or City..." onkeyup="filterDirectory()">
        <div class="table-wrapper">
            <table id="dirTable">
                <thead>
                    <tr>
                        <th>Serial Number</th>
                        <th>Customer Name</th>
                        <th>Site Address</th>
                        <th>Contact Person</th>
                        <th>Phone Number</th>
                    </tr>
                </thead>
                <tbody id="dirBody">
                    <tr><td colspan="5" style="text-align:center;">⏳ Loading directory...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let dirData = [];

        async function loadDirectory() {
            // REPLACE WITH YOUR NEW DIRECTORY GET URL
            const getDirUrl = "https://default000090a2d8654861ba6937e8e47451.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/ee7cfb42677d4076a4533739d0bcfc7e/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=jF_ztuz5yzUN3UQCMMHbl77nuG4bqSXx5YQd_jWAFZc"; 
            try {
                const response = await fetch(getDirUrl);
                dirData = await response.json();
                renderTable(dirData);
            } catch (error) {
                document.getElementById('dirBody').innerHTML = "<tr><td colspan='5' style='text-align:center; color:red;'>Failed to load directory.</td></tr>";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dirBody');
            tbody.innerHTML = "";
            data.forEach(item => {
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.SerialNumber || ""}</strong></td>
                        <td>${item.CustomerName || ""}</td>
                        <td>${item.Address || ""}</td>
                        <td>${item.ContactPerson || ""}</td>
                        <td><a href="tel:${item.Phone}">${item.Phone || ""}</a></td>
                    </tr>
                `;
            });
        }

        function filterDirectory() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = dirData.filter(i => Object.values(i).join(" ").toLowerCase().includes(query));
            renderTable(filtered);
        }

        loadDirectory();
    </script>
</body>
</html>
