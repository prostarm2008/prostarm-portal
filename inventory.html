<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prostarm - Inventory</title>
    <link rel="icon" type="png" href="Prostarm logo.png">
    <script>
        if (sessionStorage.getItem('isLoggedIn') !== 'true' && localStorage.getItem('isLoggedIn') !== 'true') {
            window.location.href = "login.html";
        }
    </script>
    <style>
		/* Action Buttons */
        .action-cell { display: flex; gap: 8px; }
        .btn-sm { padding: 6px 12px; border: none; border-radius: 6px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: 0.2s; }
        .edit-btn { background: #e0e7ff; color: #4f46e5; }
        .edit-btn:hover { background: #c7d2fe; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #f4f6f9; padding: 30px 20px; color: #334155; }
        .back-btn { display: inline-flex; padding: 10px 15px; background: #fff; border-radius: 8px; margin-bottom: 20px; border: 1px solid #cbd5e1; font-weight: 600; text-decoration: none; color: #475569; }
        .card { background: #fff; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.04); max-width: 900px; margin: 0 auto; border-top: 4px solid #4f46e5; }
        h2 { color: #1e293b; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th, td { padding: 12px; border-bottom: 1px solid #e2e8f0; }
        th { background: #f8fafc; color: #475569; text-transform: uppercase; font-size: 0.85rem; }
        .stock-high { color: #10b981; font-weight: bold; }
        .stock-low { color: #ef4444; font-weight: bold; }
    </style>
</head>
<body>
    <a href="home.html" class="back-btn">⬅ Back to Home</a>
	<div class="card">
    <h2>➕ Add / Update Part</h2>
    <form id="inventoryForm">
        <div class="row" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
            <div>
                <label style="display: block; font-weight: 600; margin-bottom: 8px;">Part Code</label>
                <input type="text" id="partCode" required placeholder="e.g. SSD-500" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>
            <div>
                <label style="display: block; font-weight: 600; margin-bottom: 8px;">Component Name</label>
                <input type="text" id="compName" required placeholder="e.g. 500GB Drive" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>
            <div>
                <label style="display: block; font-weight: 600; margin-bottom: 8px;">Quantity</label>
                <input type="number" id="qty" required placeholder="0" style="width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;">
            </div>
        </div>
        <button type="submit" id="submitInvBtn" style="width: 100%; padding: 14px 20px; background: linear-gradient(135deg, #4f46e5, #3b82f6); color: white; border: none; border-radius: 8px; font-weight: bold; font-size: 1rem; cursor: pointer;">Save Part</button>
    </form>
</div>
    <div class="card">
        <h2>📦 Spare Parts Inventory</h2>
        <input type="text" id="searchBox" placeholder="Search by Part Code or Name..." onkeyup="filterInventory()">
        <table id="inventoryTable">
            <thead>
                <tr>
                    <th>Part Code</th>
                    <th>Component Name</th>
                    <th>Quantity Available</th>
                    <th>Actions</th> </tr>
            </thead>
            <tbody id="inventoryBody">
                <tr><td colspan="3" style="text-align:center;">⏳ Loading inventory...</td></tr>
            </tbody>
        </table>
    </div>

    <script>
	
	document.getElementById('inventoryForm').addEventListener('submit', function(e) {
    e.preventDefault();
    const btn = document.getElementById('submitInvBtn');
    btn.innerText = "Saving to Cloud...";
    btn.disabled = true;

    const partData = {
        PartCode: document.getElementById('partCode').value,
        ComponentName: document.getElementById('compName').value,
        Quantity: document.getElementById('qty').value
    };
    
    // REPLACE WITH YOUR NEW 'SAVE INVENTORY' POST URL
    const postInvUrl = "https://default000090a2d8654861ba6937e8e47451.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/4090519c582a4fd4a09b4c7e4e6da421/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=sPQnOdk8l8bSh8KJyS8sHyvTjsBQD9_dB2-qv68Bn7s";

    fetch(postInvUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(partData)
    })
    .then(res => {
        if(res.ok) {
            alert("Part saved successfully!");
            document.getElementById('inventoryForm').reset();
            document.getElementById('partCode').readOnly = false; // UNLOCK THE ID
            document.getElementById('submitInvBtn').innerText = "Save Part"; // RESET BUTTON TEXT
            loadInventory();
        } else {
            alert("Failed to save part.");
        }
    })
    .catch(() => alert("Network Error"))
    .finally(() => {
        btn.innerText = "Save Part";
        btn.disabled = false;
    });
});
        let inventoryData = [];

        async function loadInventory() {
            // REPLACE WITH YOUR NEW INVENTORY GET URL
            const getInventoryUrl = "https://default000090a2d8654861ba6937e8e47451.72.environment.api.powerplatform.com:443/powerautomate/automations/direct/workflows/691a42ec14ab4e33a5c75e7d203740b1/triggers/manual/paths/invoke?api-version=1&sp=%2Ftriggers%2Fmanual%2Frun&sv=1.0&sig=pAkE_ETJFLZXANkCWDItO12Jt5XP1W-bkeorb22Y-8c"; 
            
            try {
                const response = await fetch(getInventoryUrl);
                inventoryData = await response.json();
                renderTable(inventoryData);
            } catch (error) {
                document.getElementById('inventoryBody').innerHTML = "<tr><td colspan='3' style='text-align:center; color:red;'>Failed to load live inventory.</td></tr>";
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('inventoryBody');
            tbody.innerHTML = "";
            data.forEach(item => {
                let stockClass = parseInt(item.Quantity) > 5 ? "stock-high" : "stock-low";
                tbody.innerHTML += `
                    <tr>
                        <td><strong>${item.PartCode || ""}</strong></td>
                        <td>${item.ComponentName || ""}</td>
                        <td class="${stockClass}">${item.Quantity || 0} units</td>
                        <td>
                            <div class="action-cell">
                                <button class="btn-sm edit-btn" onclick="editInventory('${item.PartCode}')">Edit</button>
                            </div>
                        </td>
                    </tr>
                `;
            });
        }

        function editInventory(partCode) {
            const part = inventoryData.find(p => p.PartCode === partCode);
            if(!part) return;

            document.getElementById('partCode').value = part.PartCode || "";
            document.getElementById('partCode').readOnly = true; // Lock part code during update
            document.getElementById('compName').value = part.ComponentName || "";
            document.getElementById('qty').value = part.Quantity || 0;
            
            document.getElementById('submitInvBtn').innerText = "Update Part";
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterInventory() {
            const query = document.getElementById('searchBox').value.toLowerCase();
            const filtered = inventoryData.filter(i => 
                (i.PartCode && i.PartCode.toLowerCase().includes(query)) || 
                (i.ComponentName && i.ComponentName.toLowerCase().includes(query))
            );
            renderTable(filtered);
        }

        loadInventory();
    </script>
</body>
</html>
